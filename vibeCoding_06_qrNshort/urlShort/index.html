<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL단축 - QRnShort</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="../" class="brand">QR<span>n</span>Short</a>
    <a href="../" class="home-link">← 홈</a>
  </header>

  <main class="card">
    <h1>URL 단축</h1>
    <p class="sub">긴 URL을 입력하고 '단축하기'를 누르세요.</p>

    <label for="url-input" class="field-label">URL 입력</label>
    <div class="row">
      <input type="url" id="url-input" placeholder="https://example.com/very/long/address" autocomplete="off">
      <button id="shorten-btn" disabled>단축하기</button>
    </div>

    <label for="result" class="field-label">단축된 URL</label>
    <div class="row">
      <input type="text" id="result" readonly placeholder="결과가 여기에 표시됩니다">
      <button id="copy-btn" class="secondary" disabled>복사</button>
    </div>

    <p id="message" class="message"></p>

    <a id="to-qr" class="to-qr hidden" href="../url2qr/index.html">▦ 단축 URL을 QR코드로 만들기</a>
  </main>

  <script src="script.js"></script>
</body>
</html>
