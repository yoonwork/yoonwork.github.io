<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 시작 홈페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <a class="sdu-logo" href="https://www.sdu.ac.kr" target="_blank" rel="noopener" title="서울디지털대학교 홈페이지">
      <span class="sdu-mark">SDU</span>
      <span class="sdu-name">서울디지털대학교</span>
    </a>
    <div class="clock" id="clock"></div>
  </header>

  <main class="container">
    <div class="brand" aria-hidden="true">
      <span class="c1">S</span><span class="c2">t</span><span class="c3">a</span><span class="c1">r</span><span class="c4">t</span>
    </div>

    <form class="search-box" action="https://www.google.com/search" method="get" target="_blank">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" name="q" id="search-input" placeholder="Google 검색 또는 URL 입력" autocomplete="off" autofocus>
    </form>
    <div class="search-buttons">
      <button type="button" id="search-btn">Google 검색</button>
      <button type="button" id="lucky-btn">I'm Feeling Lucky</button>
    </div>

    <section class="weather-section">
      <h2>오늘의 날씨</h2>
      <div class="weather-cards">
        <div class="weather-card" id="weather-seoul">
          <div class="city">서울</div>
          <div class="icon">⏳</div>
          <div class="temp">--°</div>
          <div class="desc">불러오는 중...</div>
          <div class="minmax"></div>
        </div>
        <div class="weather-card" id="weather-jeju">
          <div class="city">제주</div>
          <div class="icon">⏳</div>
          <div class="temp">--°</div>
          <div class="desc">불러오는 중...</div>
          <div class="minmax"></div>
        </div>
      </div>
    </section>

    <section class="quote-section">
      <p class="quote" id="quote-text"></p>
      <p class="author" id="quote-author"></p>
      <button type="button" class="quote-btn" id="quote-btn">다른 명언 보기</button>
    </section>
  </main>

  <footer class="footer">
    <span>대한민국</span>
    <span>프로젝트02 · 나만의 시작 홈페이지</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
